<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mum's Noticeboard.</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101214;
    color: #f7f7f5;
    font-family: Arial, Helvetica, sans-serif;
}

.dashboard {
    height: 100vh;
    width: 100vw;
    padding: 2.5vh 3vw;
    display: grid;
    grid-template-columns: 53% 47%;
    grid-template-rows: 55% 45%;
}

/* LEFT TOP */

.clock-area {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 4vw;
}

.day {
    font-size: 8vw;
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -0.15vw;
}

.date {
    margin-top: 2vh;
    font-size: 3vw;
    color: #c9c9c5;
}

.time {
    margin-top: 4vh;
    font-size: 7vw;
    line-height: 1;
    font-weight: 300;
}

/* RIGHT TOP */

.appointment {
    align-self: center;
    margin: 2vh 3vw 2vh 2vw;
    padding: 3.5vh 3vw;

    background: #351900;
    border: 2px solid #704000;
    border-radius: 22px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.appointment .heading {
    color: #e7a900;
}

.appointment-day {
    color: #e7a900;
}

    
.heading {
    color: #8f969e;
    font-size: 1.6vw;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 2vh;
}

.appointment-day {
    font-size: 2.7vw;
    font-weight: 600;
}

.appointment-title {
    margin-top: 1.5vh;
    font-size: 3.5vw;
    line-height: 1.15;
}

.appointment-note {
    margin-top: 2vh;
    color: #c9c9c5;
    font-size: 2vw;
    line-height: 1.35;
}

/* LEFT BOTTOM */

.period-area {
    display: flex;
    align-items: center;
    padding-right: 4vw;
}

.periods {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.7vw;
}

.period {
    text-align: center;
    padding: 2vh 0;
    color: #777;
    border-top: 4px solid #363a3d;
    font-size: 1.45vw;
}

.period.active {
    color: #ffffff;
    border-top-color: #e6b94a;
    font-weight: 600;
}

/* RIGHT BOTTOM */

.note-area {
    border-left: 2px solid #555;
    padding-left: 4vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.note {
    font-size: 3vw;
    line-height: 1.3;
    max-width: 90%;
}

.from {
    margin-top: 2.5vh;
    color: #a7aaad;
    font-size: 1.7vw;
}
</style>
</head>

<body>

<div class="dashboard">

    <section class="clock-area">
        <div id="day" class="day">THURSDAY</div>
        <div id="date" class="date">19 November</div>
        <div id="time" class="time">1:45 PM</div>
    </section>

<section class="appointment">
    <div class="heading">Next appointment</div>
    <div id="appointment-day" class="appointment-day">Checking calendar...</div>
    <div id="appointment-title" class="appointment-title"></div>
    <div id="appointment-note" class="appointment-note"></div>
</section>

    <section class="period-area">
        <div class="periods">
            <div id="morning" class="period">Morning</div>
            <div id="afternoon" class="period">Afternoon</div>
            <div id="evening" class="period">Evening</div>
            <div id="night" class="period">Night</div>
        </div>
    </section>

    <section class="note-area">
        <div class="heading">A note from Jason</div>

        <div id="note" class="note">
                Checking for a note...
        </div>

        <div class="from">
            Love Jason ❤️
        </div>
    </section>

</div>

<script>
function updateClock() {
    const now = new Date();

    const day = now.toLocaleDateString("en-AU", {
        weekday: "long"
    }).toUpperCase();

    const date = now.toLocaleDateString("en-AU", {
        day: "numeric",
        month: "long"
    });

    const time = now.toLocaleTimeString("en-AU", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
    });

    document.getElementById("day").textContent = day;
    document.getElementById("date").textContent = date;
    document.getElementById("time").textContent = time;

    const hour = now.getHours();

    document.querySelectorAll(".period")
        .forEach(el => el.classList.remove("active"));

    let active;

    if (hour >= 5 && hour < 12) {
        active = "morning";
    } else if (hour >= 12 && hour < 17) {
        active = "afternoon";
    } else if (hour >= 17 && hour < 21) {
        active = "evening";
    } else {
        active = "night";
    }

    document.getElementById(active).classList.add("active");
}

updateClock();
setInterval(updateClock, 1000);

const CALENDAR_ID = "624e8652b70f716d7fb9ef44420b49c8e31ab5af4a3766beba5d2fa2018b6788@group.calendar.google.com";

const API_KEY = "AIzaSyAbWHL97Yw0g9qLeNkrfdAXSxmmLU160RI";


function friendlyDay(date) {
    const now = new Date();

    const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

    const eventDay = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

    const diff = Math.round(
        (eventDay - today) / 86400000
    );

    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";

    return date.toLocaleDateString("en-AU", {
        weekday: "long",
        day: "numeric",
        month: "long"
    });
}


async function loadNextAppointment() {

    const calendar = encodeURIComponent(CALENDAR_ID);

    const url =
        "https://www.googleapis.com/calendar/v3/calendars/" +
        calendar +
        "/events" +
        "?key=" + encodeURIComponent(API_KEY) +
        "&singleEvents=true" +
        "&orderBy=startTime" +
        "&maxResults=20" +
        "&timeMin=" + encodeURIComponent(new Date().toISOString());

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Google Calendar returned " + response.status);
        }

        const data = await response.json();
        const events = data.items || [];

        const appointments = events.filter(event =>
            (event.summary || "").trim().toUpperCase() !== "NOTE"
        );

        if (appointments.length === 0) {

            document.getElementById("appointment-day").textContent =
                "Nothing coming up";

            document.getElementById("appointment-title").textContent = "";
            document.getElementById("appointment-note").textContent = "";

            return;
        }

        const event = appointments[0];

        const startValue =
            event.start.dateTime ||
            event.start.date;

        const start = new Date(startValue);

        const time = event.start.dateTime
            ? start.toLocaleTimeString("en-AU", {
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            })
            : "All day";

        document.getElementById("appointment-day").textContent =
            friendlyDay(start);

        document.getElementById("appointment-title").innerHTML =
            escapeHTML(event.summary || "Appointment") +
            "<br>" +
            escapeHTML(time);

        document.getElementById("appointment-note").textContent =
            event.description || "";

    } catch (error) {

        console.error("Calendar error:", error);

        document.getElementById("appointment-day").textContent =
            "Calendar unavailable";
    }
}

async function loadNote() {

    const calendar = encodeURIComponent(CALENDAR_ID);

    const now = new Date();

    /*
       Look backwards for NOTE events.
       Future notes are deliberately excluded until their date arrives.
    */
    const start = new Date(now);
    start.setFullYear(start.getFullYear() - 1);

    const end = new Date(now);
    end.setHours(23, 59, 59, 999);

    const url =
        "https://www.googleapis.com/calendar/v3/calendars/" +
        calendar +
        "/events" +
        "?key=" + encodeURIComponent(API_KEY) +
        "&singleEvents=true" +
        "&orderBy=startTime" +
        "&timeMin=" + encodeURIComponent(start.toISOString()) +
        "&timeMax=" + encodeURIComponent(end.toISOString()) +
        "&maxResults=250";

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Google Calendar returned " + response.status);
        }

        const data = await response.json();

        const notes = (data.items || []).filter(event =>
            (event.summary || "").trim().toUpperCase() === "NOTE"
        );

        if (notes.length > 0) {

            /* Google returned them oldest -> newest */
            const latestNote = notes[notes.length - 1];

            document.getElementById("note").textContent =
                latestNote.description || "";

        }

    } catch (error) {

        /*
           Deliberately leave the existing note on screen
           if Google temporarily can't be reached.
        */
        console.error("Note error:", error);
    }
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


loadNextAppointment();
loadNote();

setInterval(loadNextAppointment, 5 * 60 * 1000);
setInterval(loadNote, 5 * 60 * 1000);
    
</script>

</body>
</html>
